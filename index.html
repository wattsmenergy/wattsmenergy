<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watt+ Energy</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa}header{background:linear-gradient(90deg,#0b4ea2,#16a34a);color:#fff;padding:30px;text-align:center}.container{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}input,select,button{width:100%;padding:10px;margin:5px 0}button{background:#0b4ea2;color:#fff;border:none}.result{font-weight:bold}footer{background:#222;color:#fff;text-align:center;padding:15px}</style></head><body><header><h1>Watt+ Energy</h1><p>More Power Per Day</p></header><div class="container"><div class="grid"><div class="card"><h3>Solar Calculator</h3><input id="bill" type="number" placeholder="Monthly Bill Rs"><input id="tariff" type="number" value="10"><button onclick="calc()">Calculate</button><div id="res" class="result"></div></div><div class="card"><h3>ROI Calculator</h3><input id="size" type="number" placeholder="Plant Size kWp"><button onclick="roi()">Calculate ROI</button><div id="roiRes"></div></div><div class="card"><h3>Panel Selection</h3><select><option>Waaree 540Wp</option><option>Adani 550Wp</option><option>Tata 535Wp</option></select></div><div class="card"><h3>Inverter Selection</h3><select><option>Sungrow</option><option>Solis</option><option>Growatt</option></select></div></div><div class="card"><h3>Export</h3><button onclick="exportExcel()">Export Excel CSV</button><button onclick="window.print()">Export PDF (Print to PDF)</button></div></div><footer>wattsmenergy@gmail.com | +91 8669998393</footer><script>function calc(){let b=+bill.value||0,t=+tariff.value||10;let kw=((b/t)/30/4.2).toFixed(2);res.innerHTML='Recommended Plant Size: '+kw+' kWp';}function roi(){let s=+size.value||0;let cost=s*55000,sav=s*4.2*365*10;roiRes.innerHTML='Estimated Payback: '+(cost/sav).toFixed(1)+' Years';}function exportExcel(){let csv='Parameter,Value
Company,Watt+ Energy';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='WattSMEnergy.csv';a.click();}</script></body></html>
